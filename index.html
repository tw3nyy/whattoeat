<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Заготовка</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: шапка с целью дня, три раздела внизу (Блюда, Неделя, Профиль), рецепт на весь экран.
   Идея: контейнеры с едой сверху, каждое блюдо нарисовано как заготовка в стеклянном контейнере.
   Палитра: хвойный зелёный как основной, шафрановый только для цифр-акцентов и прогресса, нейтрали с зелёным уклоном. */
:root {
  --bg: #edf1ec; --card: #ffffff; --ink: #0f1f19; --muted: #5f7068; --line: #d5dfd8;
  --pine: #17614a; --pine-ink: #ffffff; --soft: #dfece5; --saff: #e7a712; --saff-soft: #fbefcb;
  --bad: #b23b27; --ok: #1d7a4f; --glass: rgba(255,255,255,.55);
  --art-s: 38%; --art-l: 84%;
  --f: 'Onest', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1511; --card: #17211c; --ink: #e8f0eb; --muted: #8fa399; --line: #28362f;
  --pine: #5fc4a0; --pine-ink: #09150f; --soft: #1b2f26; --saff: #f0b63a; --saff-soft: #3a2f12;
  --bad: #f0907b; --ok: #6cd097; --glass: rgba(255,255,255,.08); --art-s: 22%; --art-l: 22%; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1511; --card: #17211c; --ink: #e8f0eb; --muted: #8fa399; --line: #28362f;
  --pine: #5fc4a0; --pine-ink: #09150f; --soft: #1b2f26; --saff: #f0b63a; --saff-soft: #3a2f12;
  --bad: #f0907b; --ok: #6cd097; --glass: rgba(255,255,255,.08); --art-s: 22%; --art-l: 22%; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--f); -webkit-text-size-adjust: 100%; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 50; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* шапка */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.logo svg { width: 26px; height: 26px; }
.goal { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.goal b { color: var(--pine); }
#app { padding-block: 16px 104px; }
h1, h2, h3 { margin: 0; letter-spacing: -.02em; text-wrap: balance; }
h1 { font-weight: 800; font-size: 28px; line-height: 1.08; }
h2 { font-weight: 700; font-size: 18px; }
.eyebrow { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.sub { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }

/* фильтры */
.search { width: 100%; padding: 12px 16px; margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.scroller { display: flex; gap: 6px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.hot[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: var(--pine-ink); }

/* карточки блюд */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.dish { position: relative; display: flex; flex-direction: column; text-align: left; padding: 0; border: 1px solid var(--line); border-radius: 20px; background: var(--card); overflow: hidden; }
.art { display: block; width: 100%; aspect-ratio: 4 / 3; background: hsl(var(--h) var(--art-s) var(--art-l)); }
.art svg { display: block; width: 100%; height: 100%; }
.dish .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
.dish b { font-weight: 700; font-size: 15px; line-height: 1.2; }
.dish .nums { font-size: 12.5px; color: var(--muted); }
.dish .nums i { font-style: normal; font-weight: 700; color: var(--ink); }
.add { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--card); color: var(--ink); font-size: 22px; line-height: 1; display: grid; place-items: center; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
.add[aria-pressed="true"] { background: var(--pine); color: var(--pine-ink); font-size: 17px; font-weight: 800; }
.pill { position: absolute; left: 10px; bottom: calc(100% - (100% * 3 / 4) + 8px); }
.badge-row { position: absolute; left: 10px; top: 10px; display: flex; gap: 4px; }
.mini { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--card) 88%, transparent); }
.empty { margin-top: 16px; padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 18px; }

/* навигация */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
nav.tabs .in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
nav.tabs button { border: 0; background: none; padding: 7px 4px 5px; border-radius: 14px; font-weight: 600; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; }
nav.tabs svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--pine); background: var(--soft); }
.cnt { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 17px; padding: 0 5px; border-radius: 9px; background: var(--saff); color: #1c1403; font-size: 10.5px; font-weight: 800; line-height: 17px; text-align: center; }

/* неделя */
.hero { margin-top: 4px; }
.big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
.stat b { display: block; font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: -.03em; }
.stat span { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--soft); border-radius: 14px; margin-top: 16px; }
.seg button { border: 0; background: none; padding: 9px 6px; border-radius: 10px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.seg.two { grid-template-columns: 1fr 1fr; }
.panel { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; }
.panel h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .thumb { flex: none; width: 52px; height: 52px; border-radius: 12px; overflow: hidden; background: hsl(var(--h) var(--art-s) var(--art-l)); }
.row .thumb svg { width: 100%; height: 100%; display: block; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.row .t small { color: var(--muted); font-size: 12.5px; }
.step { display: flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.step button { width: 34px; height: 34px; border: 0; background: none; font-size: 18px; border-radius: 50%; line-height: 1; }
.step output, .step input { min-width: 30px; text-align: center; font-weight: 700; }
.step input { width: 62px; border: 0; background: none; padding: 0; }
.xbtn { flex: none; border: 0; background: none; color: var(--muted); font-size: 22px; padding: 4px 6px; line-height: 1; }
.bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--pine); border-radius: 4px; }
.bar.s i { background: var(--saff); }
.cmp { display: flex; justify-content: space-between; font-size: 13px; margin-top: 12px; }
.cmp b { font-weight: 800; }
.hint { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }

/* покупки */
.sec { margin-top: 14px; }
.sec h3 { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--pine); font-weight: 800; margin: 0 2px 6px; }
.sec h3 span { color: var(--muted); font-weight: 500; letter-spacing: 0; text-transform: none; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.chk { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.chk:first-child { border-top: 0; }
.chk input { appearance: none; -webkit-appearance: none; flex: none; width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line); background: var(--bg); display: grid; place-items: center; margin: 0; }
.chk input:checked { background: var(--ink); border-color: var(--ink); }
.chk input:checked::after { content: "✓"; color: var(--bg); font-size: 14px; font-weight: 800; }
.chk span { flex: 1; min-width: 0; }
.chk b { font-weight: 700; white-space: nowrap; }
.chk.done span, .chk.done b { color: var(--muted); text-decoration: line-through; font-weight: 500; }
.btn { border: 0; border-radius: 14px; padding: 13px 18px; background: var(--pine); color: var(--pine-ink); font-weight: 700; font-size: 15px; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn.full { width: 100%; }
.btns { display: flex; gap: 8px; margin-top: 12px; }
.btns .btn { flex: 1; }

/* рецепт */
.sheet { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .hd { position: relative; }
.sheet .hd .art { aspect-ratio: 16 / 10; max-height: 46vh; }
.back { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); top: 14px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--card); box-shadow: 0 1px 8px rgba(0,0,0,.2); font-size: 20px; }
.sheet .in { padding-block: 16px 130px; }
.sheet h1 { font-size: 30px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--soft); color: var(--pine); }
.kbju { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; }
.kbju div { padding: 14px 8px; text-align: center; border-left: 1px solid var(--line); }
.kbju div:first-child { border-left: 0; }
.kbju b { display: block; font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: -.03em; }
.kbju small { display: block; margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.kbju .k b { color: var(--pine); }
.porc { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 12px 16px; border-radius: 18px; background: var(--saff-soft); }
.porc b { font-weight: 700; }
.porc small { display: block; color: var(--muted); font-size: 12.5px; }
.ing { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 6px 16px; }
.ing .r { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.ing .r:first-child { border-top: 0; }
.ing .r.off .nm { text-decoration: line-through; color: var(--muted); }
.ing .nm { min-width: 0; font-weight: 600; }
.ing .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.ing .am { font-weight: 700; white-space: nowrap; }
.ing .am.dim { font-weight: 400; color: var(--muted); }
.steps { list-style: none; counter-reset: s; margin: 12px 0 0; padding: 6px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; }
.steps li { counter-increment: s; display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps li::before { content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 13px; display: grid; place-items: center; }
.tip { margin-top: 12px; padding: 12px 16px; border-radius: 16px; background: var(--saff-soft); font-size: 13.5px; }
.cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.cta .in2 { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
.cta .btn { flex: 1; }
.link { background: none; border: 0; color: var(--pine); font-weight: 700; font-size: 13px; padding: 4px 0; }

.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.field:first-of-type { border-top: 0; }
.field small { display: block; color: var(--muted); font-size: 12.5px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: pop .18s ease-out; } @keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } } }

</style>

    : `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="28" fill="var(--glass)" stroke="var(--line)" stroke-width="3"/><rect x="${bx + 8}" y="${by + 8}" width="${bw - 16}" height="${bh - 16}" rx="21" fill="none" stroke="var(--line)" stroke-width="1.5"/>`;

  const X = () => 60 + r() * 200, Y = () => 50 + r() * 140;
  if (mode === 'curl') for (let i = 0; i < 52; i++) { const x = X(), y = Y(), a = r() * 360, c = pick(); s += `<path d="M${x} ${y} q9 -11 20 0" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" transform="rotate(${a} ${x} ${y})"/>`; }
  else if (mode === 'dots') for (let i = 0; i < 170; i++) { s += `<circle cx="${X()}" cy="${Y()}" r="${2.6 + r() * 2.6}" fill="${pick()}"/>`; }

  else if (mode === 'soup') { for (let i = 0; i < 30; i++) s += `<circle cx="${X()}" cy="${Y()}" r="${4 + r() * 7}" fill="${pick()}" opacity=".95"/>`; for (let i = 0; i < 14; i++) { const x = X(), y = Y(); s += `<path d="M${x} ${y} q8 -9 17 0" fill="none" stroke="#f3e2b0" stroke-width="4" stroke-linecap="round"/>`; } }
  else if (mode === 'half') for (let i = 0; i < 16; i++) { const x = X(), y = Y(), rr = 13 + r() * 5; s += `<path d="M${x - rr} ${y} a${rr} ${rr * .9} 0 0 1 ${rr * 2} 0 z" fill="${P[1 + (i % 2)]}" stroke="${P[3]}" stroke-width="1.5" transform="rotate(${r() * 360} ${x} ${y})"/>`; }
  else if (mode === 'egg') { for (let i = 0; i < 6; i++) { const x = 90 + (i % 3) * 70 + r() * 14, y = 80 + Math.floor(i / 3) * 70 + r() * 12; s += `<circle cx="${x}" cy="${y}" r="26" fill="#fffaf0"/><circle cx="${x + 2}" cy="${y + 1}" r="12" fill="${P[0]}"/>`; } for (let i = 0; i < 40; i++) s += `<circle cx="${X()}" cy="${Y()}" r="${2.5 + r() * 2}" fill="${r() < .5 ? P[2] : P[3]}"/>`; }
  else if (mode === 'roll') { s += `<rect x="40" y="30" width="240" height="180" fill="#ead8b5"/>`; for (let k = 0; k < 2; k++) { const cx = 120 + k * 80, cy = 120 + (k ? 6 : -6); s += `<g transform="rotate(${k ? 12 : -10} ${cx} ${cy})"><rect x="${cx - 62}" y="${cy - 30}" width="124" height="60" rx="30" fill="${P[0]}"/><ellipse cx="${cx + 56}" cy="${cy}" rx="14" ry="27" fill="#f3e4bf" stroke="${P[0]}" stroke-width="3"/>`; for (let i = 0; i < 16; i++) s += `<circle cx="${cx + 50 + r() * 12 - 6}" cy="${cy + r() * 40 - 20}" r="${2.4 + r() * 2.8}" fill="${pick()}"/>`; s += `</g>`; } }
  s += `</g>`;
  if (!soup) s += `<path d="M${bx + 20} ${by + 14} h60 M${bx + 20} ${by + 24} h26" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" fill="none"/>`;
  return artCache[d.id] = `<svg viewBox="0 0 320 240" role="img" aria-label="${esc(d.name)}" preserveAspectRatio="xMidYMid slice">${s}</svg>`;
}

let R = null;

}
function closeDish() { R = null; $('#sheet').hidden = true; document.body.style.overflow = ''; }

  if (it.g === 0) return '<span class="am dim">убрано</span>';
  const g = it.g * mult, pcs = it.ug ? g / it.ug : null;
  const gs = it.u === 'мл' ? num(g) + ' мл' : num(g) + ' г';
  const f = pcs && it.u !== 'мл' && it.u !== 'г' ? `${num(Math.round(pcs * 2) / 2, 1)} ${it.u}` : null;
  return `<span class="am">${f ? f + ' · ' : ''}${gs}</span>`;
}
function stepOf(it) { return it.g >= 100 ? 10 : it.ug && it.ug > 12 ? it.ug : it.g >= 20 ? 5 : it.ug ? it.ug : 1; }
function drawSheet(top) {
  const d = byId(R.id), n = nutri(d), mult = R.mode === 'one' ? 1 : R.p, its = ingr(d), w = inWeek(d.id);
  const hasEdit = its.some(i => i.changed);

    return `<div class="r ${it.g === 0 ? 'off' : ''}"><span class="nm">${esc(it.n)}<small>${rn ? `${num(rn.b)} Б · ${num(rn.k)} ккал` : (it.changed ? 'изменено' : '')}${it.note ? (rn ? ' · ' : '') + esc(it.note) : ''}</small></span>${ctl}</div>`; }).join('');

  else if (a === 'resetdish') { delete S.edits[R.id]; save(); drawSheet(false); }
  else if (a === 'resetedits') { S.edits = {}; save(); toast('Правки сброшены'); }
  else if (a === 'clearweek') { if (t.dataset.sure) { S.week = []; S.done = {}; save(); render(); toast('Неделя очищена'); } else { t.dataset.sure = '1'; t.textContent = 'Точно очистить?'; } }
  else if (a === 'uncheck') { S.done = {}; save(); render(); }
  else if (a === 'copy') {
    const txt = shopping().map(([n, arr]) => n + '\n' + arr.map(x => `${S.done[x.k] ? '✓' : '•'} ${LBL[x.k]} ${qty(x.k, x.g)}`).join('\n')).join('\n\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Список скопирован'), () => toast('Не получилось скопировать'));
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('input[data-k]')) { S.done[el.dataset.k] = el.checked; save(); el.closest('.chk').classList.toggle('done', el.checked); }
  else if (el.matches('input[data-iv]')) { const v = parseFloat(el.value.replace(',', '.')); if (!isNaN(v)) setIng(+el.dataset.iv, v); drawSheet(false); }
});
window.addEventListener('hashchange', route);
render(); route();
</script>

</body></html>
